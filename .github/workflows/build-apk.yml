name: Build ConfigBox APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle testReleaseUnitTest

      - name: Build ConfigBox Release APK
        run: gradle assembleRelease

      - name: Prepare ConfigBox APK naming
        run: |
          mkdir -p dist
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_SRC" dist/ConfigBox.apk
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            cp "$APK_SRC" "dist/ConfigBox-${GITHUB_REF_NAME}.apk"
          fi
          ls -lh dist/

      - name: Upload ConfigBox APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConfigBox
          path: dist/ConfigBox.apk

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ConfigBox-${{ github.ref_name }}.apk
          generate_release_notes: true
